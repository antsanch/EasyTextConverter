name: Build Executables (Linux & Windows)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: pandoc-gui-linux
            asset_name: pandoc-gui-linux-x86_64
          - os: windows-latest
            artifact_name: pandoc-gui-windows
            asset_name: pandoc-gui-windows-x86_64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --name "pandoc-gui" --onefile --windowed --noconfirm --clean src/main.py

      - name: Rename binary for artifact upload
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/pandoc-gui.exe dist/${{ matrix.asset_name }}
          else
            mv dist/pandoc-gui dist/${{ matrix.asset_name }}
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

